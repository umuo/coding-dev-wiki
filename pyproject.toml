[project]
name = "coding-dev-wiki"
version = "0.1.0"
description = "Evidence-linked project understanding from Git repositories and ZIP archives"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "httpx-sse>=0.4,<1",
    "json-repair>=0.30,<1", "tiktoken>=0.12,<1", "python-dotenv>=1,<2", "python-multipart>=0.0.18,<1", "pydantic-ai-slim[openai]==2.44.0", "pydantic-ai-harness==0.36.0", "tree-sitter>=0.25,<0.26",
    "tree-sitter-python>=0.25,<0.26", "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24", "tree-sitter-java>=0.23,<0.24"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "playwright>=1.50,<2", "mkdocs>=1.6,<2", "mkdocs-mermaid2-plugin>=1.2,<2"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
