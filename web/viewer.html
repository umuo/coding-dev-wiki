<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目阅读 · Coding Dev Wiki</title><link rel="stylesheet" href="/assets/app.css"><link rel="stylesheet" href="/assets/viewer.css"></head><body class="viewer">
<header class="viewer-header"><a class="logo" href="/">◈ <span>Coding Dev Wiki</span></a><strong id="repoName">加载项目…</strong><span id="snapshot" class="badge"></span><div class="header-actions"><button id="searchOpen">搜索项目 <kbd>⌘ K</kbd></button><button id="chatOpen">项目问答</button><button id="theme">◐</button><a class="button" id="jobLink">任务日志</a></div></header>
<nav class="viewer-nav"><button id="menuToggle">☰ 导航</button><button id="overviewBtn">项目概览</button><span id="stats" class="muted"></span><span class="grow"></span><button id="back">←</button><button id="forward">→</button></nav>
<div class="workspace"><aside class="leftbar"><div class="tabs"><button class="active" data-tab="features">功能点</button><button data-tab="files">文件树</button><button data-tab="arch">架构</button></div><input id="navFilter" placeholder="筛选功能、文件…" aria-label="筛选导航"><div id="navigation"></div></aside>
<main class="reading"><div class="reading-toolbar"><div class="mode-switch"><button data-mode="chain">功能链路</button><button data-mode="focus">函数聚焦</button><button data-mode="full">完整源码</button></div><button id="copyLink">复制链接</button><button id="copyCode">复制代码</button></div><div id="breadcrumb" class="breadcrumb"></div><div class="findbar"><input id="findInput" placeholder="当前页面查找" aria-label="当前页面查找"><span id="findCount" class="muted"></span><input id="jumpInput" type="number" min="1" placeholder="跳转行号" aria-label="跳转行号"><button id="jumpBtn">跳转</button></div><div id="content" class="content"><p>正在读取分析结果…</p></div></main>
<aside class="rightbar"><div class="tabs"><button class="active" data-right="outline">符号大纲</button><button data-right="refs">跨文件引用</button></div><input id="outlineFilter" placeholder="搜索符号说明" aria-label="搜索符号说明"><div id="outline"></div></aside></div>
<dialog id="searchDialog"><div class="panel-title"><h2>搜索项目</h2><button id="searchClose">关闭 Esc</button></div><select id="searchMode" aria-label="搜索范围"><option value="all">功能 / 文件 / 符号</option><option value="features">功能点</option><option value="files">文件</option><option value="symbols">函数 / 类</option><option value="grep">全仓文本搜索</option></select><input id="searchInput" placeholder="输入功能、函数、文件或文本…" aria-label="项目搜索"><div id="searchResults"></div></dialog>
<dialog id="chatDialog"><div class="panel-title"><div><h2>与项目对话</h2><span class="muted">回答基于当前快照，可点击引用查看依据</span></div><button id="chatClose">关闭</button></div><div id="messages"><p class="muted">例如：这个项目的主要流程是什么？模型在哪里调用？</p></div><form id="chatForm"><textarea id="question" placeholder="询问当前项目…" maxlength="4000" required></textarea><button id="ask" class="primary">发送问题 ↗</button></form></dialog>
<div id="toast" role="status"></div><script type="module" src="/assets/viewer.js"></script></body></html>
